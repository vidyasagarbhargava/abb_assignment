# docker compose up --build
# API and worker are separate services so they scale and fail independently.
x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql://mlops:${POSTGRES_PASSWORD:-mlops}@db:5432/mlops
    MLOPS_LOG_LEVEL: ${MLOPS_LOG_LEVEL:-INFO}
    MLOPS_CORS_ORIGINS: '["http://localhost:4200"]'
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: mlops
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    environment:
      <<: *backend-env
      MLOPS_EMBEDDED_WORKER: "false"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      MLOPS_EMBEDDED_WORKER: "false"
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  # frontend: Angular app is out of scope for this G12 submission (see docs/known-limitations.md).

volumes:
  pgdata:
